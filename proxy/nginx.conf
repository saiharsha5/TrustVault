server {
    listen 10000;
    server_name _;

    location /api/ {
        proxy_pass https://trustvault-api-ziwt.onrender.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host trustvault-api-ziwt.onrender.com;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass https://trustvault-frontend-2eku.onrender.com;
        proxy_ssl_server_name on;
        proxy_set_header Host trustvault-frontend-2eku.onrender.com;
    }
}